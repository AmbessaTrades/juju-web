<!doctype html><html lang="en"><head><script>(function(){if(!('serviceWorker' in navigator)||navigator.serviceWorker.controller)return;window.stop();document.documentElement.style.visibility='hidden';navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(function(){return navigator.serviceWorker.ready}).then(function(){location.reload()})})()</script><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="theme-color" content="#07090C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Juju"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Juju · Crossroads</title>
<link rel="stylesheet" href="kit2.css"><script src="kit2.js"></script><script src="light.js"></script><script src="art.js"></script><script src="phone.js"></script><script src="api.js"></script><script src="flow.js"></script>
<style>
/* Crossroads: the channel's ideas, already titled, as tall cards. One tap on a card makes that film. Its look and size come from the channel;
   your own sentence is a quiet sheet. Layout only; every colour is a kit token. Server: /api/tap/channels/<slug>, POST /api/tap. */
body{--focus-x:50%;--focus-y:40%}
.ribbon{align-self:start;margin:4px 0 20px;padding:8px 28px 6px 16px;background:color-mix(in oklab,var(--act) 14%,var(--card));color:var(--bone);font:600 15px/1 "Spectral SC",serif;letter-spacing:.08em;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%);box-shadow:inset 0 0 0 1px var(--act-lo)}
.hand3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:8px 0 24px;max-width:1080px}
.hand3.wait{visibility:hidden}
.idea{position:relative;width:100%;aspect-ratio:auto;min-height:360px;padding:28px 24px 22px;display:flex;flex-direction:column;gap:16px}
.idea .kind{font:600 12.5px/1 "Josefin Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.idea .ti{font:600 24px/1.22 "Spectral SC",serif;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.idea .go{margin-top:auto;display:flex;align-items:center;gap:10px;color:var(--act);font:600 15px/1 "Josefin Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.idea .go svg{width:20px;height:20px}
.idea:first-child{filter:drop-shadow(0 0 22px var(--act-glow))}
.idea:first-child::before{background:linear-gradient(135deg,var(--act-hi),var(--act) 40%,var(--act-lo))}
.idea:not(:first-child){opacity:.86} .idea:hover{opacity:1;transform:translateY(-6px)}
.idea.going{opacity:.6;pointer-events:none}
.idea .pic{margin:-12px -10px 0;aspect-ratio:16/9;background:#000;overflow:hidden} .idea .pic img{width:100%;height:100%;object-fit:cover;display:block}
.idea.shut{cursor:not-allowed;opacity:.5;filter:grayscale(1)} .idea.shut:hover{transform:none;opacity:.5}
.idea .go.dim{color:var(--ash);text-transform:none;letter-spacing:0;font:400 15px/1.2 "Lato",sans-serif} .idea .go .lock{width:16px;height:16px}
.idea .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px} .idea .foot .go{margin-top:0} .idea .foot .tw{position:static;min-height:44px}
.empty{display:grid;justify-items:center;gap:18px;padding:64px 16px;text-align:center;color:var(--ash)}
.empty .emblem,.empty .lock{width:72px;height:72px;color:var(--smoke)}
.empty b{font:600 24px/1.2 "Spectral SC",serif;color:var(--bone)}
.more{align-self:start}
/* sheets */
.sheet h2{margin:0 0 16px}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lk{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;min-height:60px;padding:6px 10px 6px 6px;border:2px solid var(--line);background:var(--lift);color:var(--bone);cursor:pointer;text-align:left;font:600 16px/1.2 "Spectral SC",serif}
.lk img{width:72px;aspect-ratio:16/9;object-fit:cover;display:block}
.lk .ph{width:72px;aspect-ratio:16/9;display:grid;place-items:center;background:#000;color:var(--smoke)} .lk .ph svg{width:22px;height:22px}
.lk.on{border-color:var(--act);box-shadow:0 0 14px var(--act-glow)}
.lk[disabled]{cursor:not-allowed;opacity:.45;filter:grayscale(1)}
.lk small{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ash);font:400 13px/1.2 "Lato",sans-serif} .lk small .lock{width:13px;height:13px}
#brand .sheetfoot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));margin:16px -28px calc(-24px - env(safe-area-inset-bottom));padding:12px 28px calc(14px + env(safe-area-inset-bottom));background:var(--panel-b);z-index:2}
@media (max-width:760px){#brand .sheetfoot{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}}
.sizes{display:flex;gap:8px;margin-top:18px} .sizes .btn{flex:1} .sizes .btn.on{color:var(--act);box-shadow:inset 0 0 0 2px var(--act)}
.say{width:100%;min-height:96px;resize:vertical;padding:14px 16px;background:var(--a-well);color:var(--bone);border:2px solid var(--line-hi);font:400 20px/1.4 "Spectral",serif}
.say:focus{outline:none;border-color:var(--act)}
.sheetfoot{display:flex;justify-content:flex-end;margin-top:16px}
.idea.nopic{min-height:0} .idea.nopic .ti{font-size:24px}
.empty .hint{color:var(--ash);font:400 14px/1.3 "Josefin Sans",sans-serif}
.steer{width:100%;min-height:48px;margin-top:12px;padding:0 14px;background:var(--a-well);color:var(--bone);border:0;border-bottom:2px solid var(--line);font:italic 400 17px/1 "Spectral",serif}
.steer:focus{outline:none;border-color:var(--act)} .steer::placeholder{color:var(--smoke);opacity:1}
.idea .tw{position:absolute;right:10px;top:10px;min-height:44px;padding:0 10px;font-size:13px;color:var(--smoke)} .idea .tw:hover{color:var(--bone)}
#stitle{font:600 20px/1.25 "Spectral SC",serif;margin:0 0 4px}
@media (max-width:760px){
 #lookbtn{display:none} .deck .aside{display:flex;gap:4px}
 .hand3{grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:16px}
 .idea{min-height:0;padding:20px 18px 16px;gap:10px} .idea .ti{font-size:20px;-webkit-line-clamp:4}
 .idea:hover{transform:none}
 .looks{grid-template-columns:minmax(0,1fr)}
}
</style></head>
<body data-skin="nocturne" data-room="crossroads" data-title="Crossroads" data-back="altar.html" data-back-label="Altar">
<main>
 <span class="ribbon">Ideas</span>
 <div class="hand3 wait" id="hand" role="list" aria-label="Ideas"></div>
 <button class="btn bare more" id="more" hidden>More ideas</button>
</main>
<div data-tools><button class="btn bare" id="lookbtn" data-open="brand">Look</button></div>
<footer class="deck"><div class="aside"><button class="btn bare" id="own" data-open="mine">Your own</button><button class="btn bare only-phone" data-open="brand">Look</button></div><button class="primary" id="go">Make</button></footer>
<section class="sheet" id="brand" hidden aria-label="Look">
 <h2 class="h2">Look</h2>
 <div class="looks" id="looks" role="radiogroup" aria-label="Look"></div>
 <div class="sizes" id="sizes" role="radiogroup" aria-label="Size"></div>
 <div id="lens"></div>
 <div class="sheetfoot"><button class="btn need" data-close>Done</button></div>
</section>
<section class="sheet" id="mine" hidden aria-label="Your own">
 <h2 class="h2">Your own</h2>
 <textarea class="say" id="say" rows="3" maxlength="1600" aria-label="Your sentence" placeholder="One sentence"></textarea>
 <input class="steer" id="ownsteer" maxlength="200" autocomplete="off" aria-label="Steer" placeholder="told as the Tamil tradition tells it">
 <div id="lens2"></div>
 <div class="sheetfoot"><button class="btn need" id="makeown">Make</button></div>
</section>
<section class="sheet" id="steerer" hidden aria-label="Steer">
 <p id="stitle" data-d></p>
 <input class="steer" id="steer" maxlength="200" autocomplete="off" aria-label="Steer" placeholder="told as the Tamil tradition tells it">
 <div class="sheetfoot"><button class="btn need" id="makesteer">Make</button></div>
</section>
<script>
(()=>{
const $=id=>document.getElementById(id),esc=JUJU.esc,slug=Flow.ch();
if(!slug){Flow.need('crossroads');return}
let ch=null,page=0;
const kindName=k=>(ch.systems.find(s=>s.kind===k)||{}).name||'';
const shown=()=>ch.ideas.slice(page*3,page*3+3);
/* an idea card: its thumbnail when the Channels lane drew one; a locked one is greyed and says where it opens */
const fallback=()=>ch.thumb||ch.avatar||'';
/* only Juju's own thumbnail for this idea, else the channel's own picture; never one stand-in frame repeated on every card (Ambi, 26 Nov) */
const pic=x=>x.thumb?`<img src="${esc(x.thumb)}" alt="">`:fallback()?`<img src="${esc(fallback())}" alt="">`:'';
const card=(x,i)=>{const n=page*3+i,lk=x.locked||ch.locked,pc=pic(x);return `<button class="card idea${lk?' shut':''}${pc?'':' nopic'}" role="listitem" data-i="${n}" style="--n:${i}"${lk?' disabled aria-disabled="true"':''}>${pc?`<span class="pic">${pc}</span>`:''}<span class="kind" data-d>${esc(kindName(x.kind))}</span><span class="ti" data-d>${esc(x.title)}</span><span class="foot">${lk?`<span class="go dim">${Flow.lock}Opens in High Juju</span>`:`<span class="go">${Art.glyph('go')}Make</span><span class="btn bare tw" role="button" data-steer="${n}">Steer</span>`}</span></button>`};
function draw(){
 Flow.head(ch);if(!document.querySelector('.head .chan.pick'))Flow.switcher('crossroads',slug);const l=shown(),h=$('hand');
 if(ch.locked&&!l.length){h.innerHTML=`<div class="empty">${Flow.lock}<b data-d>${esc(ch.look||'')}</b><span>Opens in High Juju</span></div>`;$('go').textContent='Shelf';$('own').hidden=true}
 else if(ch.locked){h.innerHTML=l.map(card).join('');$('go').textContent='Shelf';$('own').hidden=true}
 /* a vessel with no look yet still shows the ideas Juju found for it: each idea carries its own look; with none, Find ideas or a look */
 else if(!ch.kinds.length&&!l.length){h.innerHTML=`<div class="empty">${Art.emblem('crossroads')}<b>${finding?'Juju is finding ideas for this channel':'No ideas yet'}</b>${finding?'<span class="hint">About a minute</span>':'<button class="btn need" id="find" type="button">Find ideas</button>'}</div>`;$('go').textContent='Pick a look';$('own').hidden=true}
 else if(!ch.kinds.length){h.innerHTML=l.map(card).join('');$('go').textContent='Make';$('own').hidden=true}
 /* no ideas yet: Juju looks for them on a tap (ju ideas, about a minute and a tenth of a cent), or the person writes their own */
 else if(!l.length){h.innerHTML=`<div class="empty">${Art.emblem('crossroads')}<b>${finding?'Juju is finding ideas for this channel':'No ideas yet'}</b>${finding?'<span class="hint">About a minute</span>':'<button class="btn need" id="find" type="button">Find ideas</button>'}</div>`;$('go').textContent='Your own'}
 else{h.innerHTML=l.map(card).join('');$('go').textContent='Make';$('own').hidden=false}
 $('more').hidden=ch.ideas.length<=3||ch.locked;
 h.classList.remove('wait');Kit.deal&&Kit.deal(h);drawBrand()}
function drawBrand(){
 $('looks').innerHTML=ch.systems.map(s=>`<button class="lk${s.id===ch.system?' on':''}" role="radio" aria-checked="${s.id===ch.system}" data-s="${esc(s.id)}"${s.locked?' disabled aria-disabled="true"':''}>${s.themes&&s.themes[0]?`<img src="/api/tap/themes/${esc(s.themes[0])}.jpg" alt="" onerror="this.outerHTML='<span class=ph></span>'">`:`<span class="ph">${s.locked?Flow.lock:''}</span>`}<span><span data-d>${esc(s.name)}</span>${s.locked?`<small>${Flow.lock}Opens in High Juju</small>`:''}</span></button>`).join('');
 $('sizes').innerHTML=ch.sizes.map(h=>`<button class="btn${h===ch.export?' on':''}" role="radio" aria-checked="${h===ch.export}" data-h="${h}">${Flow.size(h)}</button>`).join('');
 /* the length sent to the film program as --minutes; with none set it makes 2 (lead, 26 Nov). 20 and 28 are long films, slower. */
 /* the channel's length, on its Look sheet and on the make sheet; every make sends it */
 const pick=x=>JUJU.patch('/api/tap/channels/'+slug,{minutes:x}).then(()=>{ch.minutes=x;drawBrand()}).catch(e=>JUJU.say($('lens'),e.say));
 Flow.lenpick($('lens'),ch.minutes,pick);Flow.lenpick($('lens2'),ch.minutes,pick)}
let finding=false;
async function load(){ch=await JUJU.get('/api/tap/channels/'+slug);try{const I=await JUJU.get('/api/tap/channels/'+slug+'/ideas');if(I.running&&!finding){finding=true;watchIdeas()}}catch(e){}draw()}
function watchIdeas(){JUJU.poll('/api/tap/channels/'+slug+'/ideas',I=>{if(!I.running){finding=false;load();return false}return true},{every:5000,fail:()=>{}})}
document.addEventListener('click',e=>{const f=e.target.closest('#find');if(!f)return;JUJU.once(f,async()=>{await JUJU.post('/api/tap/channels/'+slug+'/ideas');finding=true;draw();watchIdeas()})});
async function make(body,at){
 /* Ambi 26 Nov: say it starts a whole film, and that another one is already cooking, before anything starts */
 const fl=(await JUJU.get('/api/tap/films').catch(()=>({films:[]}))).films||[],mins=Flow.minutes(ch.minutes),busy=fl.filter(f=>f.state==='running').length,first=!fl.some(f=>f.state==='done'&&f.here);
 const ok=await JUJU.confirm({title:'Make this film?',go:'Make it',stay:'Not now',lines:[{text:body.sentence||'',cls:'t'},
  `About ${mins} minutes long. Juju writes it, voices it, draws the maps and cuts it, by itself.`,
  `It takes about ${JUJU.makeMinutes(mins)} minutes and spends from the money set aside.`,
  first?'The first film on this phone downloads about 600 MB of maps once. Use Wi-Fi.':null,
  busy?{text:`${busy===1?'A film is':busy+' films are'} already being made. This one starts when ${busy===1?'it is':'they are'} done.`,cls:'warn'}:null]});
 if(!ok)return;
 const r=await JUJU.post('/api/tap',Object.assign({channel:slug,minutes:Flow.minutes(ch.minutes),test:Flow.TEST||undefined},body));Kit.finish($('go'),'Making it');const on=()=>JUJU.go('cauldron.html?ch='+slug+'&f='+encodeURIComponent(r.film));if(r.say){Kit.toast(r.say);setTimeout(on,2600)}else on();return r}
let steering=null;
function makeIdea(i,btn,steer){const x=ch.ideas[i];if(!x)return;btn&&btn.classList.add('going');
 return JUJU.once(btn||$('go'),()=>make({kind:x.kind,sentence:x.sentence,theme:x.theme,steer:steer||undefined}),{at:$('go'),done:()=>{btn&&btn.classList.remove('going')}})}
$('hand').addEventListener('click',e=>{const t=e.target.closest('[data-steer]');if(t){e.stopPropagation();steering=+t.dataset.steer;$('stitle').textContent=ch.ideas[steering].title;$('steer').value='';Kit.sheet('steerer').open();setTimeout(()=>$('steer').focus(),60);return}
 const b=e.target.closest('[data-i]');if(b)makeIdea(+b.dataset.i,b)});
$('makesteer').addEventListener('click',()=>{if(steering==null)return;makeIdea(steering,$('makesteer'),$('steer').value.trim())});
$('steer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('makesteer').click()}});
$('go').addEventListener('click',()=>{
 if(ch.locked)return JUJU.go('shelf.html?ch='+slug);
 if(!ch.kinds.length)return Kit.sheet('brand').open();
 const l=shown();if(!l.length)return Kit.sheet('mine').open();
 makeIdea(page*3,$('hand').querySelector('[data-i]'))});
$('more').addEventListener('click',()=>{page=(page+1)%Math.ceil(ch.ideas.length/3);draw()});
$('looks').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b||b.disabled)return;Kit.press(b);
 JUJU.once(b,async()=>{await JUJU.patch('/api/tap/channels/'+slug,{system:b.dataset.s});page=0;await load()})});
$('sizes').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;Kit.press(b);
 JUJU.once(b,async()=>{await JUJU.patch('/api/tap/channels/'+slug,{export:+b.dataset.h});await load()})});
$('makeown').addEventListener('click',()=>{const s=$('say').value.trim();if(s.length<3){JUJU.say($('makeown'),'One sentence');$('say').focus();return}
 JUJU.once($('makeown'),()=>make({sentence:s,steer:$('ownsteer').value.trim()||undefined}))});
JUJU.ready(()=>{load().catch(e=>{$('hand').classList.remove('wait');JUJU.say($('go'),e.say)});JUJU.money&&JUJU.money()});
})();
</script>
</body></html>
