<script>
(()=>{
const LIB='../../../../context-repo/09-assets/library/';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
/* who sits beside us: shelf outliers 039 to 104 (outliers.json); view counts are left out until read, so none show */
const C=[["069","4_lsxy5fsac","Bygone Philosophy",709000,17.08,41500,"The Highest State a Human Can Reach"],["075","KJg1-FCweWI","The Opening",2800000,8.19,342000,"What you'll see when you die"],["088","xU60JQSjxLc","Universe Dimensions",10000000,81.3,123000,"What TON 618 Would Look Like at Different Distances"],["070","vvLRZOHdNqA","Bygone Philosophy",349000,8.41,41500,"The Art of Not Trying"],["100","ylnTesFVoOo","AFTER THE DOOR",2600000,60.47,43000,"What If Every Step Made You Twice as Big?"],["082","gpLC_ELulyg","Minute Zero",2400000,48.0,50000,"What If You Sped Up and Couldn't Stop?"],["095","gcQNBKYhuUo","Stargaze",4800000,8.63,556500,"What If a Black Hole Entered Our Solar System? (Simulation)"],["091","51ZathOeW2E","Server History",3100000,10.88,285000,"IF WW2 WAS A DISCORD CHAT (HISTORICALLY ACCURATE)"],["098","lyRHFOcNMTU","Planet B",1700000,20.24,84000,"Why Scientists Fear the Great Himalayan Earthquake"],["071","v90SZKGbMRo","Bygone Philosophy",309000,7.45,41500,"You Will Never Procrastinate Again After Watching This Video"],["089","7c_qUXqRZFo","Universe Dimensions",1300000,10.57,123000,"The Night Sky When BETELGEUSE Goes SUPERNOVA (Simulation)"],["066","eWu92oXtxsw","ExtinctZoo",3400000,4.09,832000,"The Deadliest Sea Animal From Every Single Period"],["079","TAsqnXcCqRI","WhatIfAnimations",441000,81.67,5400,"What If Light Kept Getting Slower and Couldn't Stop?"],["042","LqvlFsTaZgE","Mapocalypse",392000,8.0,49000,"I Simulated Yellowstone Erupting, Day by Day"],["102","uYcWVAOV-bI","Whatfinity",1500000,833.33,1800,"What If You Never Stopped Running?"]].map(r=>({n:r[0],id:r[1],ch:r[2],v:r[3],x:r[4],u:r[5],t:r[6]}));
const img=s=>LIB+s.n+'-'+s.id+'-outlier.jpg';

const ST=Kit.state||'layout', FROM=Kit.param('from')||'mirror-bend', DOOR=Kit.param('door')||FROM;
const ROOMS={'mirror-bend':'Mirror Bend',crossroads:'Crossroads',pact:'Pact','publish-kit':'Kit'};
const b=document.body;b.dataset.back=FROM+'.html?from=feed-sight';b.dataset.backLabel=ROOMS[FROM]||'Mirror Bend';
/* our film: the sample film's own title and thumbnail words (runs/first-film/film.json) */
const OURS={t:'The ENTIRE Journey After Death in 52 Minutes',w:['He came','back'],ch:'Library of Tehuti'};
const GEO=[{s:[.56,.12,.36],w:[.06,.3,.48]},{s:[.03,.04,.45],w:[.46,.3,.48]},{s:[.6,.3,.26],w:[.06,.36,.48]}];
const ON_PHONE=matchMedia('(max-width:760px)').matches;
const M={view:['home','phone','side','tv'].includes(ST)?ST:Kit.param('view')||(ON_PHONE?'phone':'home'),seen:new Set(),v:Kit.param('v')?(+Kit.param('v')-1):0,pos:ON_PHONE?0:1,title:OURS.t,
 slots:['layout','layout','layout'],eyes:[0,0,0],looks:[0,0,0],blink:null};
const SL={ready:['painted','painted','painted'],checking:['checking','painted','painted'],'failed-check':['fix','painted','painted'],dropped:['painted','painted','dropped'],
 held:['held','painted','painted'],'all-failed':['dropped','dropped','dropped'],'two-rounds':['dropped','dropped','dropped'],done:['painted','painted','painted'],'not-fixed':['painted','painted','painted'],mumu:['painted','painted','painted']}[ST];
if(SL)M.slots=SL.slice();
if(ST==='ready'){M.seen=new Set([M.view])}
if(['done','not-fixed','mumu','checking','failed-check','dropped','held'].includes(ST))M.seen=new Set(['home','phone','side','tv']);
if(ST==='light'){}
const SAY={layout:['','Layout only'],'after-film':['','Film frame later'],stale:['work','Reading numbers'],offline:['','Offline'],locked:['need','Face check off'],
 done:['work','In use'],'not-fixed':['stop','Not fixed'],mumu:['stop','Mumu took this card'],'all-failed':['stop','Too busy'],'two-rounds':['stop','Needs frames'],
 held:['need','Same as last'],'failed-check':['need','Words at edge'],checking:['work','Checking'],ready:['need','Open all four']}[ST];

const $=id=>document.getElementById(id);let go;
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function lay(k,o={}){const g=GEO[k],pc=v=>(v*100).toFixed(1)+'%',ws=k===2?[OURS.w[1]]:OURS.w,right=g.w[0]>.4;
 return `<span class="lay"><span class="mass" style="left:${pc(g.s[0])};top:${pc(g.s[1])};width:${pc(g.s[2])};bottom:0"></span>${o.words===false?'':`<span class="wd${right?' r':''}" data-d style="left:${pc(g.w[0])};top:${pc(g.w[1])};width:${pc(g.w[2])}">${ws.length>1?esc(ws[0]):''}<b>${esc(ws[ws.length-1])}</b></span>`}${o.tag?'<span class="tag">Layout</span>':''}</span>`}
function ourThumb(k,o){const s=M.slots[k];
 if(s==='painted'||s==='checking'||s==='fix'||s==='held')return `<span class="plate"><span data-art="plate" data-state="${s==='checking'?'working':'empty'}"></span><span class="says"><b>${s==='checking'?'Checking':'Painted'}</b></span></span>`;
 return lay(k,o)}
function itemHTML(c,i,blank){if(c==='ours'){return `<button class="it ours${M.ringOurs?' ring':''}${blank?' blank':''}" data-i="${i}" data-ours><span class="th">${ourThumb(M.v,{tag:1})}<span class="len"></span></span><span class="row2"><span class="av" data-d>L</span><span><span class="tt" data-d id="ourtitle" data-u="u9">${esc(M.title)}</span><span class="ch"><span data-d>${OURS.ch}</span><br>No views yet</span></span></span></button>`}
 return `<button class="it${blank?' blank':''}" data-i="${i}" data-n="${c.n}" data-u="u10"><span class="th"><img src="${img(c)}" alt="" loading="lazy"><span class="len"></span></span><span class="row2"><span class="av" data-d>${esc(c.ch[0])}</span><span><span class="tt" data-d>${esc(c.t)}</span><span class="ch" data-d>${esc(c.ch)}</span></span></span></button>`}
function feedItems(n,pos){const out=[];let k=0;for(let i=0;i<n;i++)out.push(i===pos?'ours':C[k++%C.length]);return out}

 const f=$('feed');const n=M.view==='side'?10:M.view==='tv'?8:M.view==='phone'?6:9;const items=feedItems(n,M.pos);
 if(M.view==='side')f.innerHTML=`<div class="player">${Art.glyph('play')}</div><div class="rail2">${items.map((c,i)=>itemHTML(c,i,blank)).join('')}</div>`;
 else f.innerHTML=items.map((c,i)=>itemHTML(c,i,blank)).join('');
 f.querySelectorAll('[data-art]').forEach(e=>Art.fill(e))}
function renderTabs(){document.querySelectorAll('#views .tab').forEach(t=>{const v=t.dataset.view;t.setAttribute('aria-selected',v===M.view);t.querySelector('.dot')?.remove();if(!M.seen.has(v))t.insertAdjacentHTML('beforeend','<i class="dot" aria-label="not looked at yet"></i>')});
 $('light').disabled=M.view==='tv'}
function renderVsq(){$('vsq').innerHTML=M.slots.map((s,k)=>{const struck=s==='dropped';return `<button class="${k===M.v?'on':''}${struck?' struck':''}" data-v="${k}" aria-label="Version ${k+1}${struck?', dropped: too busy when small':''}">${ourThumb(k,{words:false})}<span class="n" data-d>${k+1}</span></button>`}).join('');$('vsq').querySelectorAll('[data-art]').forEach(e=>Art.fill(e))}
function renderEye(){const n=M.looks[M.v];$('eye').innerHTML=n?`Eye <b data-d>${M.eyes[M.v]}/${n}</b>`:''}
function renderDeck(){let label='Use it',fn=useIt,dis=false,u=DOOR==='pact'?'u20':DOOR==='publish-kit'?'u21':'u19';
 const painted=['painted','checking','fix','held'].includes(M.slots[M.v]);
 if(ST==='ready'&&M.seen.size<4){dis=true}
 if(M.slots[M.v]==='held'){dis=true}
 if(ST==='all-failed'){label='Make it simpler';fn=()=>nav('mirror-bend.html?from=feed-sight&state=ready&simpler=1');u='u23'}
 if(ST==='two-rounds'){label='Take none';fn=()=>nav($('none').href);u='u24'}
 if(ST==='mumu'){label='Crossroads';fn=()=>nav('crossroads.html?from=feed-sight')}

 $('none').href=DOOR==='publish-kit'?'publish-kit.html?from=feed-sight':'pact.html?from=feed-sight&thumb=none';
 $('bendagain').hidden=ST==='all-failed'||ST==='two-rounds';$('bendagain').href=`mirror-bend.html?from=feed-sight&door=${DOOR}`;
 $('line').innerHTML=SAY&&!(ST==='ready'&&M.seen.size===4)?`<span class="say ${SAY[0]}" style="font-size:15px">${SAY[1]}</span>`:''}
function render(){renderTabs();renderFeed();renderVsq();renderEye();renderDeck()}

function useIt(){const o=document.querySelector('.it.ours .th');if(o){o.style.transition='transform .35s,opacity .35s';o.style.transform='translateY(-18px) scale(1.05)';o.style.opacity='.3'}

 nav(DOOR==='publish-kit'?'publish-kit.html?from=feed-sight':'pact.html?from=feed-sight'+(painted?'':'&thumb=none'))}

/* blink: cover, 0.4 s of feed with ours in a random place, cover, then a tap */
function blink(){if(M.blink)return;if(ON_PHONE&&(M.view==='home'||M.view==='tv')){M.view='phone';M.seen.add('phone');renderTabs()}
 const yt=$('yt'),cv=document.createElement('div');cv.className='cover';cv.innerHTML='<span class="cat"></span><span>Look here</span>';cv.querySelector('.cat').innerHTML=window.JujuCat;
 const n=M.view==='side'?10:6;M.pos=Math.floor(Math.random()*(M.view==='phone'?2:Math.min(n,6)));M.blink=1;renderFeed();yt.scrollTop=0;yt.append(cv);
 setTimeout(()=>{cv.remove();setTimeout(()=>{renderFeed(true);const ask=document.createElement('div');ask.className='cover ask';ask.textContent='Tap where yours was';yt.append(ask);M.blink=2},400)},reduce()?300:900)}
/* u5: the tap where yours was */
function answer(i){const right=i===M.pos;M.looks[M.v]++;if(right)M.eyes[M.v]++;M.blink=null;document.querySelector('.cover.ask')?.remove();renderFeed();
 const o=document.querySelector('.it.ours');o.classList.add('answer');renderEye();
 Kit.toast(`Eye found it ${M.eyes[M.v]} of ${M.looks[M.v]}`,{state:right?'':'need'})}

document.addEventListener('DOMContentLoaded',()=>{
 go=$('go');
 document.querySelectorAll('.rail .door').forEach(d=>{const k=d.getAttribute('href').split('.')[0];d.dataset.u={altar:'u16',crossroads:'u17',cauldron:'u18'}[k]||''});{const bk=document.querySelector('.head .back');if(bk){bk.dataset.u={'mirror-bend':'u13',pact:'u14','publish-kit':'u15',crossroads:'u22'}[FROM]||'';if(FROM==='crossroads')bk.querySelector('span').textContent='Cards'}}M.seen.add(M.view);
 if(ST==='blink'){render();const yt=$('yt'),cv=document.createElement('div');cv.className='cover';cv.innerHTML='<span class="cat"></span><span>Look here</span>';cv.querySelector('.cat').innerHTML=window.JujuCat;yt.append(cv)}
 else render();
 if(ST==='light')$('yt').classList.add('light'),$('light').setAttribute('aria-pressed','true'),renderFeed();
 if(ST==='competitor')openComp('088');
 $('views').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;M.view=t.dataset.view;const was=M.seen.size;M.seen.add(M.view);if(M.view==='tv'){$('yt').classList.remove('light');$('light').setAttribute('aria-pressed','false')}render();
  if(ST==='ready'&&was===3&&M.seen.size===4)Kit.toast('All four views seen')});
 $('vsq').addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(!v)return;M.v=+v.dataset.v;if(M.slots[M.v]==='dropped')Kit.toast('Version '+(M.v+1)+' was dropped: too busy when small',{state:'stop'});render();Kit.press(v)});
 $('blink').onclick=blink;
 $('squint').onclick=e=>{const on=$('yt').classList.toggle('squint');e.currentTarget.setAttribute('aria-pressed',on)};
 $('light').onclick=e=>{if(M.view==='tv')return;const on=$('yt').classList.toggle('light');e.currentTarget.setAttribute('aria-pressed',on)};
 $('move').onclick=()=>{const n=6;let p;do{p=Math.floor(Math.random()*n)}while(p===M.pos);M.pos=p;M.ringOurs=1;renderFeed();M.ringOurs=0;Kit.toast('Moved')};
 $('feed').addEventListener('click',e=>{const it=e.target.closest('.it');if(!it)return;
  if(M.blink===2){answer(+it.dataset.i);return}if(M.blink)return;
  if(it.hasAttribute('data-ours')){if(e.target.closest('#ourtitle'))editTitle(it);return}
  openComp(it.dataset.n)});
});
function openComp(n){const c=C.find(x=>x.n===n);if(!c)return;$('cs-t').textContent=c.t;$('cs-img').src=img(c);$('cs-ch').textContent=c.ch;$('cs-v').textContent=kf(c.v);$('cs-u').textContent=kf(c.u);
 $('cs-bend').href=`mirror-bend.html?from=feed-sight&door=${DOOR}&donor=${c.n}`;Kit.sheet('compsheet').open()}
function editTitle(it){if(document.querySelector('.tedit'))return;const box=document.createElement('div');box.className='tedit';box.innerHTML=`<input aria-label="Our title" value="${esc(M.title)}">`;
 const th=it.querySelector('.row2');th.style.position='relative';th.append(box);const inp=box.querySelector('input');inp.focus();inp.select();
 inp.addEventListener('input',()=>{document.getElementById('ourtitle').textContent=inp.value});
 const done=()=>{M.title=inp.value.trim()||M.title;box.remove();renderFeed();Kit.toast('Title saved. Checked again.')};
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();if(e.key==='Escape'){box.remove();renderFeed()}});inp.addEventListener('blur',done)}
/* proof aid: ?do=<css>;<css>~<text> taps (or types into) those controls in order, so a still can show the state after a tap. Not part of the room. */
document.addEventListener('DOMContentLoaded',()=>{(Kit.param('do')||'').split(';').filter(Boolean).forEach((q,i)=>setTimeout(()=>{const [c,v]=q.split('~'),e=document.querySelector(c);if(!e){console.error('do: nothing at '+c);return}if(v!=null){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));return}e.click()},40+i*130))});
})();
</script>
</body>
