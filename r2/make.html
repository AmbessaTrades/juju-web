<!doctype html><html lang="en"><head><script>(function(){if(!('serviceWorker' in navigator)||navigator.serviceWorker.controller)return;window.stop();document.documentElement.style.visibility='hidden';navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(function(){return navigator.serviceWorker.ready}).then(function(){location.reload()})})()</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Juju · Make</title>
<link rel="stylesheet" href="kit2.css"><script src="kit2.js"></script><script src="light.js"></script><script src="art.js"></script><script src="phone.js"></script><script src="api.js"></script>
<style>
/* Make: one sentence, a kind, a theme, Make. The film's words move by themselves; the film plays here. Layout only; colours are kit tokens.
   Server: /api/tap (crates/juju-serve/src/make.rs), which runs juju-maps/ju make. */
body{--focus-x:30%;--focus-y:30%}
.mk{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px 32px;align-content:start;padding-bottom:24px}
.mk.wait{visibility:hidden}
.ask{display:grid;gap:12px;align-content:start;min-width:0}
#idealist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ideas{display:grid;gap:8px}
.ideas h2,.ask h2{margin:0;color:var(--ash);font:600 13px/1 "Josefin Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.idea{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-content:center;width:100%;min-height:62px;padding:6px 12px;border:2px solid var(--line);background:var(--lift);color:var(--bone);cursor:pointer;text-align:left;font:400 17px/1.3 "Spectral",serif}
.idea:hover,.idea:focus-visible{border-color:var(--act);outline:none}
.idea .k{color:var(--ash);font:600 11px/1 "Josefin Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;min-width:64px}
.idea b{font-weight:400;font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sizes{display:flex;gap:8px}
.sizes .btn{flex:1}
.sizes .btn.on{color:var(--act);border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.say{width:100%;min-height:64px;resize:vertical;padding:14px 16px;background:var(--lift);color:var(--bone);border:2px solid var(--line-hi);border-radius:2px;font:400 20px/1.4 "Spectral",serif}
.say:focus{outline:none;border-color:var(--act)}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds .btn{min-width:0;flex:1 1 auto}
.kinds .btn.on{color:var(--act);border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.themes[hidden]{display:none}
.th{position:relative;display:grid;gap:6px;padding:0;border:2px solid var(--line);background:none;color:var(--ash);cursor:pointer;text-align:left;font:600 13px/1 "Josefin Sans",sans-serif;letter-spacing:.06em;min-height:44px}
.th img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.th span{padding:0 6px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on{border-color:var(--act);color:var(--act);box-shadow:0 0 14px var(--act-glow)}
.see{display:grid;gap:14px;align-content:start;min-width:0}
.screen{position:relative;aspect-ratio:16/9;background:#000;border:2px solid var(--line-hi);overflow:hidden;width:100%}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.screen .now{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:var(--bone);font:600 20px/1.3 "Spectral",serif;text-align:center;padding:16px}
.screen .now[hidden]{display:none}
.screen .now .t{font:400 16px/1.4 "Spectral",serif;color:var(--ash);max-width:90%;overflow-wrap:anywhere}
.bar{width:60%;height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--work);animation:go 1.6s linear infinite}
@keyframes go{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%}}
.ctl{display:flex;gap:8px;align-items:center;min-height:44px}
.ctl .name{flex:1;min-width:0;color:var(--bone);font:600 17px/1.3 "Spectral",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:grid;gap:6px;max-height:340px;overflow:auto;padding-right:4px;padding-bottom:84px}
.ask{padding-bottom:84px}
.f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:48px;padding:6px 12px;border:0;border-left:3px solid var(--line);background:var(--lift);color:var(--bone);cursor:pointer;text-align:left;font:400 16px/1.3 "Spectral",serif}
.f b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .pill{justify-self:end}
.f.on{border-left-color:var(--act)}
.f.gold{border-left-color:var(--need)}
@media (max-width:760px){
  #idealist{grid-template-columns:1fr}
  .mk{grid-template-columns:minmax(0,1fr);gap:18px}
  .say{font-size:18px;min-height:84px}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .th{font-size:11px} .th span{padding:0 5px 6px}
  .screen{margin:0 -16px;width:auto;border-width:2px 0}
  .list{max-height:none}
}
</style></head>
<body data-skin="nocturne" data-room="make" data-mark="conjuring" data-title="Make">
<main>
 <div class="mk wait" id="mk">
  <section class="ask">
   <div class="ideas" id="ideas"><h2>Ideas</h2><div class="ideas" id="idealist"></div></div>
   <div class="sizes" id="sizes" role="radiogroup" aria-label="Size"></div>
   <h2>Your own</h2>
   <textarea class="say" id="say" rows="3" maxlength="1600" aria-label="Sentence" placeholder="One sentence"></textarea>
   <div class="kinds" id="kinds" role="radiogroup" aria-label="Kind"></div>
   <div class="themes" id="themes" role="radiogroup" aria-label="Theme"></div>
  </section>
  <section class="see">
   <div class="screen"><video id="v" controls playsinline preload="metadata"></video><div class="now" id="now"><span id="nowsay" data-d>Make one</span><div class="bar" id="bar" hidden><i></i></div><span class="t" id="nowt" data-d></span></div></div>
   <div class="ctl"><span class="name" id="cur" data-d></span><button class="btn need" id="accept" hidden>Accept</button><button class="btn stop" id="stop" hidden>Stop</button><button class="btn bare" id="drop" hidden>Drop</button><button class="btn need" id="again" hidden>Again</button><button class="btn" id="export" hidden>Export</button><a class="btn" id="save" download hidden>Save</a></div>
   <div class="list" id="list"></div>
  </section>
 </div>
</main>
<footer class="deck"><div class="aside"></div><button class="primary" id="go">Make</button></footer>
<script>
(()=>{
const $=s=>document.getElementById(s),esc=JUJU.esc,v=$('v'),END=['done','stopped','failed','refused'];
let menu=null,kind=null,theme=null,films=[],shown=null,poll=null,size=null;
try{kind=localStorage.getItem('juju.kind');theme=localStorage.getItem('juju.theme');size=+localStorage.getItem('juju.size')||null}catch(e){}
const sizeName=h=>h===1440?'2K':h+'p';
function drawSizes(){if(!menu.sizes.includes(size))size=menu.size_first;
 $('sizes').innerHTML=menu.sizes.map(h=>`<button class="btn${h===size?' on':''}" role="radio" aria-checked="${h===size}" data-h="${h}">${sizeName(h)}</button>`).join('')}
function drawIdeas(){const kn=k=>(menu.kinds.find(x=>x.id===k)||{}).name||k,l=menu.ideas.slice(0,matchMedia('(max-width:760px)').matches?4:6);
 $('ideas').hidden=!l.length;$('idealist').innerHTML=l.map((x,i)=>`<button class="idea" data-i="${i}"><span class="k">${esc(kn(x.kind))}</span><b data-d>${esc(x.title)}</b></button>`).join('')}
$('sizes').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;size=+b.dataset.h;keep('juju.size',size);Kit.press(b);drawSizes();const f=films.find(x=>x.id===shown);if(f)show(f)});
async function start(body,btn){const r=await JUJU.post('/api/tap',Object.assign({export:size},body));shown=r.film;await load();watch();document.querySelector('.see').scrollIntoView({block:'start',behavior:'smooth'});return r}
$('idealist').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=menu.ideas[+b.dataset.i];
 JUJU.once(b,()=>start({sentence:x.sentence,kind:x.kind,theme:x.theme}),{at:$('go')})});
const keep=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
function drawKinds(){
 if(!menu.kinds.length){$('kinds').innerHTML='';$('themes').hidden=true;return}
 if(!menu.kinds.some(k=>k.id===kind))kind=menu.kinds[0].id;
 const k=menu.kinds.find(x=>x.id===kind),ts=menu.themes.filter(t=>k.allowed.includes(t.id));
 if(ts.length&&!ts.some(t=>t.id===theme))theme=ts[0].id;
 $('kinds').innerHTML=menu.kinds.map(k=>`<button class="btn${k.id===kind?' on':''}" role="radio" aria-checked="${k.id===kind}" data-k="${k.id}">${esc(k.name)}</button>`).join('');
 $('themes').innerHTML=ts.map(t=>`<button class="th${t.id===theme?' on':''}" role="radio" aria-checked="${t.id===theme}" data-t="${t.id}">${t.frame?`<img src="${t.frame}" alt="" loading="lazy">`:''}<span>${esc(t.name)}</span></button>`).join('');
 $('themes').hidden=!k.themes;
}
$('kinds').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;keep('juju.kind',kind);Kit.press(b);drawKinds()});
$('themes').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;theme=b.dataset.t;keep('juju.theme',theme);Kit.press(b);drawKinds()});
const state=f=>f.gold?'Kept':f.say||'Making',short=t=>t.split(' ').slice(0,4).join(' ');
const pill=f=>f.gold?'need':f.state==='done'?'':END.includes(f.state)?'stop':'work';
function drawList(){
 $('list').innerHTML=films.map(f=>`<button class="f${f.gold?' gold':''}${shown===f.id?' on':''}" data-f="${esc(f.id)}"><b data-d>${esc(f.title||f.sentence||f.id)}</b><span class="pill ${pill(f)}" data-d>${esc(short(state(f)))}</span></button>`).join('');
}
function show(f){
 shown=f?f.id:null;drawList();
 const making=f&&!f.gold&&!END.includes(f.state);
 $('cur').textContent=f?(f.title||f.sentence||''):'';
 const bad=f&&!f.gold&&['failed','stopped','refused'].includes(f.state);
 $('again').hidden=!bad;$('drop').hidden=!bad;$('accept').hidden=!(f&&f.draft&&f.state==='done');
 $('stop').hidden=!(making||f&&f.export&&f.export.state==='running');
 const big=f&&(f.exports||[]).find(x=>x.h===size)||f&&(f.exports||[]).slice(-1)[0];
 $('save').hidden=!(f&&f.film);if(f&&f.film){$('save').href=big?big.film:f.film;$('save').textContent=big?'Save '+sizeName(big.h):'Save'}
 const ex=f&&f.export&&['running','queued'].includes(f.export.state);
 $('export').hidden=!(f&&f.film&&!f.gold&&!(f.exports||[]).some(x=>x.h===size));$('export').disabled=!!ex;$('export').textContent=ex?(f.export.words||'Exporting')+' '+sizeName(f.export.h):'Export '+sizeName(size);
 if(f&&f.export&&['failed','stopped'].includes(f.export.state))JUJU.say($('export'),f.export.error||'Stopped');
 if(f&&f.film){$('now').hidden=true;if(v.getAttribute('src')!==f.film){v.src=f.film}}
 else{v.removeAttribute('src');v.load();$('now').hidden=false;$('bar').hidden=!making;$('nowsay').textContent=f?state(f):'Make one';$('nowt').textContent=f?(making?(f.sentence||''):(f.error||'')):''}
}
async function load(){
 const a=await JUJU.get('/api/tap/films');films=a.films;
 const live=films.find(f=>!f.gold&&!END.includes(f.state));
 const f=films.find(x=>x.id===shown)||live||null;show(f);
 
}
function watch(){if(poll)poll.stop();poll=JUJU.poll('/api/tap/films',a=>{films=a.films;const f=films.find(x=>x.id===shown);const was=$('stop').hidden;show(f||null);
 const live=films.some(x=>!x.gold&&!END.includes(x.state));
 if(f&&f.state==='done'&&!was){Kit.finish($('go'),'Ready');v.play().catch(()=>{})}
 if(!live)JUJU.money();return true},{every:()=>films.some(x=>!x.gold&&(!END.includes(x.state)||x.export&&x.export.state==='running'))?2000:8000})}
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=films.find(x=>x.id===b.dataset.f);Kit.press(b);show(f);if(f&&f.film)v.play().catch(()=>{})});
$('go').addEventListener('click',()=>JUJU.once($('go'),async()=>{
 const s=$('say').value.trim();if(s.length<3){JUJU.say($('go'),'Write a sentence');$('say').focus();return}
 const k=menu.kinds.find(x=>x.id===kind),body={sentence:s,kind};if(k.themes)body.theme=theme;
 return start(body)}));
$('export').addEventListener('click',()=>JUJU.once($('export'),async()=>{const r=await JUJU.post('/api/tap/films/'+encodeURIComponent(shown)+'/export',{h:size});await load();watch();return r}));
const act=(b,path)=>JUJU.once($(b),async()=>{const r=await JUJU.post('/api/tap/films/'+encodeURIComponent(shown)+path);await load();watch();return r});
$('again').addEventListener('click',()=>act('again','/again'));
$('drop').addEventListener('click',()=>JUJU.once($('drop'),async()=>{const r=await JUJU.post('/api/tap/films/'+encodeURIComponent(shown)+'/drop');shown=null;await load();return r}));
$('accept').addEventListener('click',()=>JUJU.once($('accept'),async()=>{const r=await JUJU.post('/api/tap/films/'+encodeURIComponent(shown)+'/title',{accept:true});Kit.finish($('go'),'Title kept');await load();return r}));
$('stop').addEventListener('click',()=>JUJU.once($('stop'),async()=>{const r=await JUJU.post('/api/tap/films/'+encodeURIComponent(shown)+'/stop');await load();return r}));
$('save').addEventListener('click',e=>{if(!$('save').href)e.preventDefault()});
v.addEventListener('error',()=>{if(v.getAttribute('src'))JUJU.say($('save'),'Does not play','stop')});
JUJU.ready(async()=>{
 for(;;){try{menu=await JUJU.get('/api/tap');break}catch(e){JUJU.say($('go'),e.say);await new Promise(r=>setTimeout(r,4000))}}
 drawKinds();drawSizes();drawIdeas();try{await load()}catch(e){JUJU.say($('go'),e.say)}
 $('mk').classList.remove('wait');watch();
});
})();
</script>
</body></html>
