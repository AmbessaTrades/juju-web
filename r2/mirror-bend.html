  bx.onpointermove=ev=>{const dx=(ev.clientX-x0)/R.width,dy=(ev.clientY-y0)/R.height,n=M.boxes[k];
   if(grip){n.w=Math.max(.1,Math.min(1-r.x,r.w+dx));n.h=Math.max(.1,Math.min(1-r.y,r.h+dy))}else{n.x=Math.max(0,Math.min(1-r.w,r.x+dx));n.y=Math.max(0,Math.min(1-r.h,r.y+dy))}
   bx.style.left=n.x*100+'%';bx.style.top=n.y*100+'%';bx.style.width=n.w*100+'%';bx.style.height=n.h*100+'%';renderOurs();renderVers()};
  bx.onpointerup=()=>{bx.onpointermove=null;bx.classList.remove('held')}}});
 const bb=$('boxbtn');if(bb)bb.onclick=e=>{e.stopPropagation();M.boxes=M.boxes?null:{s:{x:.55,y:.1,w:.38,h:.86},w:{x:.05,y:.28,w:.46,h:.38}};renderTheirs();renderOurs();renderVers()}}

/* the donor sheet */
let chFilter=null;
function outList(){const L=SHELF.filter(s=>!chFilter||s.ch===chFilter).sort((a,b)=>b.x-a.x);
 $('filter').innerHTML=chFilter?`<button class="btn bare" id="clearf" style="margin-top:10px">${Art.glyph('close')}<span data-d>${esc(chFilter)}</span></button>`:'';
 $('outlist').innerHTML=L.map(s=>`<button class="row${M.donor&&M.donor.n===s.n?' on':''}" data-n="${s.n}" data-u="u2"><span class="tile pic"><img src="${img(s)}" alt="" loading="lazy"></span><b class="name" data-d>${esc(s.t)}</b><span class="val num" data-d>${x2(s.x)}</span></button>`).join('');
 const cf=$('clearf');if(cf)cf.onclick=()=>{chFilter=null;outList()}}
function chList(){const C={};SHELF.forEach(s=>C[s.ch]=(C[s.ch]||0)+1);
 $('chlist').innerHTML=Object.entries(C).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="row" data-ch="${esc(c)}" data-u="u3"><span class="tile">${Art.emblem('vessel')}</span><b class="name" data-d>${esc(c)}</b><span class="val num" data-d>${n}</span></button>`).join('')}
function setDonor(s){M.donor=s;M.study=null;M.reading=false;M.boxes=null;M.slots=M.slots.map(x=>x.s==='painted'?{s:'old'}:x);Kit.sheet('donorsheet').close();render();Kit.toast('Three layouts redrawn')}
function pasteLink(v){const inp=$('link');v=(v||'').trim();inp.classList.remove('bad');
 const m=v.match(/^(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/)([\w-]{11})/);
 if(/\/shorts\/|\/live\//.test(v)){inp.classList.add('bad');Kit.toast('YouTube would not show this one',{state:'stop'});return}
 if(!m){inp.classList.add('bad');Kit.toast('That is not a normal YouTube video',{state:'stop'});return}
 const s=SHELF.find(x=>x.id===m[1]);if(s){setDonor(s);return}
 M.donor=null;M.reading=true;Kit.sheet('donorsheet').close();render();Kit.toast('The picture comes first, then its views');setTimeout(()=>{if(M.reading)$('meta').innerHTML='<span>Mac asleep</span>'},1400)}

document.addEventListener('DOMContentLoaded',()=>{
 go=document.getElementById('go');
 document.querySelectorAll('.rail .door').forEach(d=>{const k=d.getAttribute('href').split('.')[0];d.dataset.u={altar:'u34',crossroads:'u35',cauldron:'u36'}[k]||''});{const bk=document.querySelector('.head .back');if(bk)bk.dataset.u={'feed-sight':'u28',vessel:'u29',canopy:'u30',reliquary:'u31',pact:'u32','publish-kit':'u33',crossroads:'u37'}[FROM]||''}
 outList();chList();render();
 /* the styles sheet: each style as its own drawn layout */
 const drawStyles=()=>{$('styles').innerHTML=STYLES.map(s=>{const keep=M.style;M.style=s.k;const h=lay(0);M.style=keep;return `<button class="sty${s.k===M.style?' on':''}" data-k="${s.k}"><span class="frame">${h}</span><span>${s.n}, ${s.p}</span></button>`}).join('')};drawStyles();
 if(ST==='empty'||Kit.param('pick'))Kit.sheet('donorsheet').open();
 if(Kit.param('simpler'))simpler();
 if(ST==='style')Kit.sheet('stylesheet').open();
 if(ST==='idea'||ST==='free-try'&&false)Kit.sheet('ideasheet').open();
 if(ST==='subject'||ST==='no-photo')Kit.sheet('subjsheet').open();
 $('theirs').addEventListener('click',e=>{if(e.target.closest('.box,.ctl'))return;Kit.sheet('donorsheet').open()});
 $('ours').addEventListener('click',()=>{if(matchMedia('(max-width:760px)').matches)$('bend').classList.toggle('swap')});
 /* phone: tap the small picture to swap which one is big; swipe the big one to change version */
 $('theirs').addEventListener('click',e=>{if(matchMedia('(max-width:760px)').matches&&!$('bend').classList.contains('swap')){e.stopImmediatePropagation();$('bend').classList.add('swap')}},true);
 let sx=null;$('ours').addEventListener('pointerdown',e=>sx=e.clientX);$('ours').addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>40){M.v=(M.v+(e.clientX<sx?1:2))%3;renderOurs();renderVers();renderDeck()}sx=null});
 $('vers').addEventListener('click',e=>{const v=e.target.closest('.ver');if(!v)return;M.v=+v.dataset.v;renderOurs();renderVers();renderDeck();Kit.press(v)});
 $('outlist').addEventListener('click',e=>{const r=e.target.closest('[data-n]');if(r)setDonor(byN[r.dataset.n])});
 $('chlist').addEventListener('click',e=>{const r=e.target.closest('[data-ch]');if(!r)return;chFilter=r.dataset.ch;outList();document.querySelector('#donorsheet .tab').click()});
 $('pastebtn').onclick=async()=>{let v=$('link').value;if(!v){try{v=await navigator.clipboard.readText();$('link').value=v}catch(e){}}pasteLink(v)};
 $('link').addEventListener('keydown',e=>{if(e.key==='Enter')pasteLink(e.target.value)});
 $('link').addEventListener('paste',e=>setTimeout(()=>pasteLink(e.target.value),0));
 const readFile=f=>{if(!f||!/^image\//.test(f.type)||f.size>20e6){Kit.toast('This file cannot be read',{state:'stop'});return}const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{M.study={src:r.result,small:Math.max(i.width,i.height)<640};M.donor=null;M.reading=false;Kit.sheet('donorsheet').close();render();Kit.toast('Study only. No views claimed.')};i.src=r.result};r.readAsDataURL(f)};
 $('file').onchange=e=>readFile(e.target.files[0]);
 const T=$('theirs');T.addEventListener('dragover',e=>{e.preventDefault();T.classList.add('drop')});T.addEventListener('dragleave',()=>T.classList.remove('drop'));
 T.addEventListener('drop',e=>{e.preventDefault();T.classList.remove('drop');const f=e.dataTransfer.files[0];if(f){readFile(f);return}const u=e.dataTransfer.getData('text');if(u)pasteLink(u)});T.dataset.u2='u6';
 /* idea sheet */
 const ii=$('idea-in'),wi=$('words-in'),wc=$('wcount');
 document.querySelector('[data-open=ideasheet]').addEventListener('click',()=>{ii.value=M.idea;wi.value=M.words;wc.textContent=(M.words.split(/\s+/).filter(Boolean).length)+'/3';setTimeout(()=>ii.focus(),60)});
 wi.addEventListener('input',()=>{const n=wi.value.split(/\s+/).filter(Boolean).length;wc.textContent=n+'/3';wc.style.color=n>3?'var(--stop-hi)':''});
 $('bendit').onclick=()=>{const n=wi.value.split(/\s+/).filter(Boolean);if(n.length>3){Kit.toast('Three words at most',{state:'stop'});return}
  const changed=ii.value!==M.idea||wi.value!==M.words;M.idea=ii.value.trim();M.words=n.join(' ');
  if(changed)M.slots=M.slots.map(x=>x.s==='painted'?{s:'old'}:x);Kit.sheet('ideasheet').close();render();Kit.toast('Bent this way')};
 /* style sheet */
 $('styles').addEventListener('click',e=>{const s=e.target.closest('.sty');if(!s)return;M.style=s.dataset.k;drawStyles();render();Kit.press(s)});
 $('wordsrule').addEventListener('click',e=>{const x=e.target.closest('[data-w]');if(!x)return;M.wrule=x.dataset.w;$('wordsrule').querySelectorAll('[data-w]').forEach(y=>y.setAttribute('aria-pressed',y===x));render();drawStyles()});
 let undo=null;$('keepch').onclick=()=>{const k=$('keepch');if(undo){Object.assign(M,undo);undo=null;k.textContent='Keep for this channel';drawStyles();render();Kit.toast('The earlier start is back');return}
  undo={style:'woodcut',wrule:'theirs'};k.textContent='Kept. Undo';k.dataset.u='u14';Kit.toast('The start for every next film',{art:Art.seal({state:'pressed',emblem:'vessel'})})};
 /* subject sheet */
 $('subjrows').addEventListener('click',e=>{const r=e.target.closest('[data-s]');if(!r||r.disabled)return;const s=r.dataset.s;$('personbox').hidden=s!=='person';$('relicbox').hidden=s!=='relic';
  if(s==='juju'){M.subject='juju';render();Kit.sheet('subjsheet').close()}if(s==='person')setTimeout(()=>$('person-in').focus(),50)});
 $('person-in').addEventListener('keydown',e=>{if(e.key!=='Enter')return;Kit.toast('Looking in the archives');setTimeout(()=>{Kit.toast('No photo of that person we may use. Juju picks.',{state:'need'});M.subject='juju';document.querySelector('[data-s=juju]').click()},reduce()?0:900)});
 if(ST==='film-drawn'){const fr=$('framerow');fr.disabled=false;fr.classList.remove('off');fr.querySelector('.val').remove();Kit.sheet('subjsheet').open();$('moments').hidden=false;$('moments').innerHTML=['Cold Open','The Waking and the Court','The King of the Dead','Heaven Ends','The Last Lot','The River and the Waking'].map((a,k)=>`<button class="sty${k?'':' on'}" data-m="${k}"><span class="frame"><span class="plate"><span data-art="plate" data-state="empty"></span></span></span><span data-d>${a}</span></button>`).join('');fillArt($('moments'));$('moments').onclick=e=>{const m=e.target.closest('.sty');if(m){$('moments').querySelectorAll('.sty').forEach(x=>x.classList.toggle('on',x===m));Kit.press(m)}}}
 if(ST==='no-photo'){$('personbox').hidden=false;$('person-in').value='@Er of Pamphylia'}
 /* the phone back key closes a sheet first (the kit's Escape does it at the desk) */
});
/* proof aid: ?do=<css>;<css>~<text> taps (or types into) those controls in order, so a still can show the state after a tap. Not part of the room. */
document.addEventListener('DOMContentLoaded',()=>{(Kit.param('do')||'').split(';').filter(Boolean).forEach((q,i)=>setTimeout(()=>{const [c,v]=q.split('~'),e=document.querySelector(c);if(!e){console.error('do: nothing at '+c);return}if(v!=null){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));return}e.click()},40+i*130))});
})();
