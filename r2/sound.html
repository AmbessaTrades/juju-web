<style>

body{--focus-x:34%;--focus-y:40%}

.sd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:34px;align-items:start}
.left{display:grid;gap:18px;align-content:start}

.big .h2{overflow-wrap:anywhere}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;border:0;background:none;padding:0;cursor:pointer;color:var(--ash);font:400 16px/1.3 "Lato",sans-serif;text-align:left}

<script>
document.addEventListener('DOMContentLoaded',()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ST=Kit.state,FROM=Kit.param('from')||(ST==='from-a-scene'?'spell-strip':ST==='from-the-receipt'?'pact':''),phone=()=>matchMedia('(max-width:760px)').matches;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,say=(t,o)=>Kit.toast(t,Object.assign({ms:2600},o||{}));
let seedN=20,shelf=[],cur=null,thrown=null,setMode=null,beds=[],bedOn='none',sample=false,tab='sounds';
const S=(name,st,o={})=>Object.assign({id:'s'+(++seedN),name,st,seed:seedN,takes:[]},o);
const net=ST!=='no-network';
/* the one real sample: a learned page turn measured on this Mac, z 2.8 against the candidate mark 3.0 */
const page=S('a page turned','close',{heard:'a page turn',z:'2.8 / 3.0',from:'Learned',real:true});
const presets={
 making:()=>{shelf=[S('rain on a tin roof','making')]},
 checking:()=>{shelf=[S('a coin dropped on wood','checking',{from:'Learned'})]},
 passed:()=>{shelf=[S('water poured into a cup','passed',{heard:'pouring water',second:'Agrees',from:'Learned'})]},
 close:()=>{shelf=[page]},
 failed:()=>{shelf=[S('a stone door closing','failed',{heard:'an explosion',second:'Objects',from:'Invented'})]},
 kept:()=>{shelf=[Object.assign(page,{st:'kept'}),S('wind over dry grass','passed',{heard:'wind',second:'Agrees',from:'Learned'})]},
 'set-to-hear':()=>{shelf=[['a page turned','a page turn'],['a candle flame','a small fire'],['wind over dry grass','wind'],['a wooden pile settling','wood creaking'],['a heavy door','a door closing'],['a bell far off','a distant bell'],['bare feet on stone','footsteps'],['a slow river','running water'],['a crowd murmuring','a crowd']].map(([n,h])=>S(n,'passed',{heard:h,second:'Agrees',from:'Learned'}));setMode={i:0,n:shelf.length,kept:0}},
 'from-a-scene':()=>{shelf=[S('bare feet on dry earth','passed',{heard:'footsteps on dirt',second:'Agrees',from:'Learned'})]},
 'waiting-for-a-render':()=>{shelf=[S('a candle flame','unheard',{waiting:true,from:'Learned'})]},
 'phone-ears-not-here':()=>{shelf=[S('a bell far off','unheard',{noears:true,from:'Learned'})]},
 'from-the-receipt':()=>{presets['set-to-hear']();setMode=null},
};
if(presets[ST]){presets[ST]();sample=ST!=='close'}
cur=shelf.find(s=>s.st!=='kept')||shelf[0]||null;
if(ST==='kept')cur=shelf[0];
if(ST==='from-the-receipt')cur=null;
/* ---------- drawing ---------- */
const bigArt=$('#bigart');let prog=0,playing=false;
function drawBig(){const s=cur,st=!s?'empty':s.st==='kept'?'kept':playing?'playing':s.st==='making'?'empty':'made';bigArt.innerHTML=Art.sound({state:st,seed:s?s.seed:1,progress:prog})}
/* the verdict: one state word, then what the ears heard (data) */
function verdict(s){
 if(!s)return shelf.length&&FROM==='pact'?['need','Hear the set',String(shelf.length)]:['dim','Empty',''];
 if(s.st==='passed')return ['work','Passed',s.heard];
 if(s.st==='close')return ['need','Close',s.heard+(s.z?' · '+s.z:'')];
 if(s.st==='failed')return ['stop','Refused',s.heard];
 if(s.st==='kept')return ['work','Kept',''];
 if(s.st==='making')return ['work','Making',''];
 if(s.waiting)return ['dim','Waiting',''];
 if(s.noears)return ['dim','Not checked',''];
 if(s.checkfail)return ['stop','Check failed',''];
 return ['work','Checking','']}
function render(){const s=cur;drawBig();
 $('#sname').textContent=s?s.name:'';$('#sname').hidden=!s;
 const [c,w,h]=verdict(s);$('#verdict').innerHTML=`<span class="pill ${c}">${w}</span>${h?`<span class="heard" data-d>${h}</span>`:''}`;$('#verdict').hidden=!s&&!(FROM==='pact'&&shelf.length);
 $('#play').hidden=!s||s.st==='making';
 $('#takes').hidden=!s||s.st==='making'||s.st==='unheard'||!!setMode;
 $('#closer').hidden=!(s&&s.takes.length);
 $('#checks').hidden=!(s&&(s.waiting||s.checkfail));$('#checknow').hidden=!(s&&s.waiting);$('#checkagain').hidden=!(s&&s.checkfail);
 $('#ears').hidden=!(s&&s.noears);
 $('#setnav').hidden=!setMode||setMode.done;if(setMode)$('#setcount').textContent=(setMode.i+1)+' / '+setMode.n;
 $('#tag').innerHTML='';
 $('#scenecard').hidden=FROM!=='spell-strip';
 $('#where').textContent=setMode?'Hear the set':'';
 $('.big .top').hidden=!$('#where').textContent;$('#find').hidden=tab==='music'||shelf.length<4;
 drawShelf();primary()}
function rowOf(s){const pip=s.st==='kept'?'done':s.st==='failed'?'failed':s.st==='making'||s.st==='checking'?'now':'next';
 return `<button class="row${s===cur?' on':''}${s.st==='failed'?' stop':''}" data-id="${s.id}" data-u="u3"><span class="tile">${Art.pip({state:pip})}</span><span><b class="name" data-d>${s.name}</b></span></button>`}
function drawShelf(){const q=$('#find').value.trim().toLowerCase(),f=s=>!q||s.name.includes(q);
 const wait=shelf.filter(s=>s.st!=='kept'&&s.st!=='thrown'&&s.st!=='failed'&&f(s)),bad=shelf.filter(s=>s.st==='failed'&&f(s)),kept=shelf.filter(s=>s.st==='kept'&&f(s));
 $('#nk').textContent=shelf.filter(s=>s.st!=='thrown').length;
 const grp=(l,a)=>`<div class="group"><span class="lab"><span>${l}</span><span class="num" data-d>${a.length}</span></span>${a.length?`<div class="rows">${a.map(rowOf).join('')}</div>`:''}</div>`;
 let h='';if(wait.length)h+=grp('Waiting',wait);if(bad.length)h+=grp('Refused',bad);h+=grp('Kept',kept);$('#shelf').innerHTML=h}
const go=$('#go');
function primary(){const s=cur;let label='Ask for a sound',dis=false,need=false,u='u4';
 if(tab==='music'){label=FROM==='spell-strip'?'Use for this film':'Use as channel music';u=FROM==='spell-strip'?'u8':'u24';dis=bedOn==='none'&&!beds.length}
 else if(setMode){label=setMode.done?'Done, the set is yours':'Keep this sound';u=setMode.done?'u25':'u20';need=!!setMode.done}
 else if(FROM==='pact'&&!s&&shelf.length){label='Hear the set';u='u20'}
 else if(!s||s.st==='kept'&&FROM!=='spell-strip'){label='Ask for a sound';u='u4'}
 else if(s.st==='failed'){label='Make it again';u='u5'}
 else if(s.st==='making'){label='Keep this sound';dis=true}
 else if(FROM==='spell-strip'){label='Use in this scene';u='u7'}
 else label='Keep this sound';
 go.textContent=label;go.dataset.u=u;go.disabled=dis;go.classList.toggle('need',need)}
/* ---------- play and scrub ---------- */
let raf=0;function stop(){playing=false;cancelAnimationFrame(raf);$('#play').innerHTML=Art.glyph('play');$('#play').setAttribute('aria-label','Play');drawBig()}
$('#play').onclick=()=>{if(!cur)return;if(playing)return stop();playing=true;$('#play').innerHTML=Art.glyph('pause');$('#play').setAttribute('aria-label','Stop');
 if(reduce){prog=1;drawBig();return}const t0=performance.now()-prog*2600;const step=t=>{prog=Math.min(1,(t-t0)/2600);drawBig();if(prog<1&&playing)raf=requestAnimationFrame(step);else{prog=0;stop()}};raf=requestAnimationFrame(step)};
bigArt.addEventListener('pointerdown',e=>{if(!cur||cur.st==='making')return;const r=bigArt.querySelector('svg').getBoundingClientRect();const at=x=>{prog=Math.max(0,Math.min(1,((x-r.left)/r.width*560-150)/400));const p=playing;playing=true;drawBig();playing=p};
 at(e.clientX);bigArt.setPointerCapture(e.pointerId);const mv=ev=>at(ev.clientX),up=()=>{bigArt.removeEventListener('pointermove',mv);bigArt.removeEventListener('pointerup',up)};bigArt.addEventListener('pointermove',mv);bigArt.addEventListener('pointerup',up)});
/* ---------- the shelf ---------- */
$('#shelf').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;stop();cur=shelf.find(s=>s.id===r.dataset.id);prog=0;render();Kit.press($(`.row[data-id="${cur.id}"]`));if(cur.st==='close')say('Close. Your ear decides.',{state:'need'})});
$('#find').addEventListener('input',drawShelf);
/* ---------- ask, make, check ---------- */
const CHIP=/\b(8[- ]?bit|retro|chiptune)\b/i;
function make(words,from){words=(words||'').trim();if(!words||CHIP.test(words)){say('Name a real thing: a bell, a coin on wood.',{state:words?'stop':'need'});return false}
 const s=S(words,'making',{from:from||'Learned'});shelf.unshift(s);cur=s;prog=0;render();say('Making. Ask for the next one meanwhile.');
 setTimeout(()=>{s.st='checking';render()},reduce?0:1300);
 setTimeout(()=>{if(!net){s.checkfail=true}else{s.st='passed';s.heard=words;s.second='Agrees'}render()},reduce?0:3200);return true}
$('#make').onclick=()=>{if(make($('#askfield').value))$('#askfield').value=''};
$('#askfield').addEventListener('keydown',e=>{if(e.key==='Enter')$('#make').click()});
$('#make2').onclick=()=>{if(make($('#askfield2').value)){$('#askfield2').value='';Kit.sheet('asksheet').close()}};
$('#checkagain').onclick=()=>{cur.checkfail=false;cur.st='checking';render();setTimeout(()=>{cur.st='passed';cur.heard=cur.name;cur.second='Agrees';render()},reduce?0:1500)};
$('#checknow').onclick=()=>{say('The render paused at its last finished act.');cur.waiting=false;cur.st='checking';render();setTimeout(()=>{cur.st='passed';cur.heard=cur.name;cur.second='Agrees';render();say('Checked. The render goes on.')},reduce?0:1500)};
$$('[data-take]').forEach(b=>b.onclick=()=>{if(!cur)return;const t=S(cur.name+', '+b.dataset.take.toLowerCase(),'checking',{from:'New take'});cur.takes=[cur.id,t.id];t.takes=[cur.id,t.id];shelf.splice(shelf.indexOf(cur)+1,0,t);const a=cur;cur=t;render();say('A new take beside the old one. Hear both.');
 setTimeout(()=>{t.st='passed';t.heard=a.heard||a.name;t.second='Agrees';render()},reduce?0:1500)});
$('#closer').addEventListener('click',e=>{const b=e.target.closest('[data-pickt]');if(!b||!cur)return;const [a,c]=cur.takes.map(id=>shelf.find(s=>s.id===id));const keep=b.dataset.pickt==='0'?a:c,drop=keep===a?c:a;
 shelf=shelf.filter(s=>s!==drop);keep.takes=[];cur=keep;render();say('Kept the closer one')});
$('#throw').onclick=()=>{if(!cur)return;stop();clearTimeout(thrown&&thrown.t);thrown={s:cur,i:shelf.indexOf(cur)};shelf=shelf.filter(s=>s!==cur);cur=shelf.find(s=>s.st!=='kept')||null;render();$('#putback').hidden=false;say('Thrown out. A sound already in a film stays there.');
 thrown.t=setTimeout(()=>{$('#putback').hidden=true;thrown=null},7000)};
$('#undo').onclick=()=>{if(!thrown)return;clearTimeout(thrown.t);shelf.splice(thrown.i,0,thrown.s);cur=thrown.s;$('#putback').hidden=true;thrown=null;render()};
let sx=null;$('#big').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});$('#big').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(setMode&&!setMode.done){if(dx>60)setStep(true);if(dx<-60)setStep(false)}else if(dx<-80)$('#throw').click()});
/* ---------- hear the set ---------- */
function setStep(keep){if(!setMode||setMode.done)return;const s=shelf[setMode.i];if(keep){s.st='kept';setMode.kept++}else s.st='thrown';
 if(setMode.i<setMode.n-1){setMode.i++;cur=shelf[setMode.i];prog=0;render();Kit.press($('#big'))}else{setMode.done=true;cur=null;render();say(setMode.kept+' kept. The set may now enter this channel\'s films.',{art:Art.seal({state:'live'})})}}
$('#setkeep').onclick=()=>setStep(true);$('#setthrow').onclick=()=>setStep(false);
document.addEventListener('keydown',e=>{if(!setMode||document.querySelector('.sheet:not([hidden])'))return;if(e.key==='ArrowRight')setStep(true);if(e.key==='ArrowLeft')setStep(false)});
/* ---------- the primary ---------- */
go.onclick=()=>{const s=cur,u=go.dataset.u;if(go.disabled)return;
 if(u==='u4'&&(!s||s.st==='kept')){if(phone())Kit.sheet('asksheet').open();else $('#askfield').focus();return}
 if(u==='u20'&&!setMode){presets['set-to-hear']();cur=shelf[0];render();say('Right keeps, left throws out.');return}
 if(u==='u20'){setStep(true);return}
 if(u==='u25'){Kit.finish(go,'The set is yours');setTimeout(()=>location.href=FROM==='pact'?'pact.html':'vessel.html',900);return}
 if(u==='u5'){const w=s.name;shelf=shelf.filter(x=>x!==s);make(w,'Learned');return}
 if(u==='u7'){Kit.finish(go,'In the scene, on its phrase');setTimeout(()=>location.href='spell-strip.html',900);return}
 if(u==='u8'){Kit.finish(go,'The film\'s music is swapped');setTimeout(()=>location.href='spell-strip.html',900);return}
 if(u==='u24'){Kit.finish(go,'This channel\'s music, from the next film');return}
 if(u==='u4'&&s){stop();s.st='kept';s.takes=[];Kit.finish(go,'Sealed on this shelf');cur=shelf.find(x=>x.st!=='kept'&&x.st!=='thrown'&&x.st!=='failed')||s;prog=0;render()}};
/* ---------- tabs: sounds and music ---------- */
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.panel==='p-music'?'music':'sounds';render()});
function drawBeds(){const all=[{id:'none',name:'No music'}].concat(beds);
 $('#beds').innerHTML=all.map(b=>`<button class="row${b.id===bedOn?' on':''}" data-bed="${b.id}"><span class="tile">${Art.emblem('sound')}</span><span><b class="name"${b.id==='none'?'':' data-d'}>${b.name}</b></span></button>`).join('');primary()}
$('#beds').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;bedOn=r.dataset.bed;drawBeds();Kit.press($(`[data-bed="${bedOn}"]`))});
$('#findbed').onclick=()=>{if(!net){say('No network. Find a free bed needs one.',{state:'stop'});return}const b=$('#findbed');b.disabled=true;b.textContent='Looking';
 setTimeout(()=>{b.disabled=false;b.textContent='Free bed';say('No bed we may use was found. Add music you own.',{state:'need'})},reduce?0:1600)};
/* ---------- sheets: heard, parts, device ---------- */
document.addEventListener('click',e=>{if(e.target.closest('[data-open="heard"]')){const s=cur;$('#heardname').textContent=s?s.name:'';
  $('#heardkv').innerHTML=s?`<dt>Asked for</dt><dd data-d>${s.name}</dd><dt>First ear</dt><dd>${['checking','unheard','making'].includes(s.st)?'Not yet':s.real?s.heard+' · '+s.z:(s.heard||s.name)}</dd><dt>Second ear</dt><dd>${s.second||'Not yet'}</dd><dt>Made from</dt><dd>${s.from||'Not made'}</dd>`:''}});
$('#loud').addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;$$('#loud .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));say(b.textContent+' in every film of this channel')});
let parts=['a soft thump on wood','paper crumpling, quiet, short'];
function drawParts(){$('#parts').innerHTML=parts.map((p,i)=>`<div class="part" data-u="u15"><input class="field" value="${p}" data-i="${i}" aria-label="Part ${i+1}"><button class="btn icon" data-rm="${i}" aria-label="Take this part out"${parts.length<=2?' disabled':''}>${Art.glyph('close')}</button><span class="found${i%2?'':' ok'}">${i%2?'Nothing yet':'Found'}</span></div>`).join('');$('#addpart').disabled=parts.length>=5}
drawParts();
$('#parts').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b&&!b.disabled){parts.splice(+b.dataset.rm,1);drawParts()}});
$('#parts').addEventListener('input',e=>{const i=e.target.dataset.i;if(i!=null)parts[+i]=e.target.value});
$('#addpart').onclick=()=>{if(parts.length<5){parts.push('');drawParts();$$('#parts .field').pop().focus()}};
$('#build').onclick=()=>{Kit.sheet('partsheet').close();make(parts.filter(Boolean).join(', then '),'Built')};
let devKind='sound',whose=null;document.addEventListener('click',e=>{const o=e.target.closest('[data-open="device"]');if(o){devKind=o.dataset.kind;$('#devh').textContent=devKind==='music'?'Add music I own':'From this device';whose=null;$$('#whose .btn').forEach(x=>x.setAttribute('aria-pressed','false'));$('#licence').hidden=true;$('#devkeep').disabled=true;$('#filename').textContent=''}});
$('#pickfile').onclick=()=>{$('#filename').textContent='recording.wav';$('#devkeep').disabled=!whose};
$('#whose').addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;whose=b.dataset.w;$$('#whose .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#licence').hidden=whose!=='other';$('#devkeep').disabled=!$('#filename').textContent});
$('#devkeep').onclick=()=>{Kit.sheet('device').close();if(devKind==='music'){beds.push({id:'b'+beds.length,name:'Your bed'});bedOn='b'+(beds.length-1);drawBeds();say('Cut into a clean loop, levelled under a voice.')}else{const s=S('your recording','checking',{from:'Yours'});shelf.unshift(s);cur=s;render();say('Listening to your recording.')}};
$('#getears').onclick=()=>{Kit.sheet('earsheet').close();say('The ears come down on Wi-Fi.')};
/* ---------- start: each state says its one sentence once ---------- */
const NOTE={close:['Close. Your ear decides.','need'],checking:['Checking'],failed:['Heard as an explosion','stop'],
 'waiting-for-a-render':['The check waits'],'phone-ears-not-here':['Waiting for the Mac','need'],'no-network':['No network','need'],
 'set-to-hear':['Right keeps, left throws out','need'],'from-the-receipt':['Hear the set first','need'],'music-empty':['No music yet'],
 empty:['Ask for the first sound']};
if(ST==='music-empty'||(FROM==='spell-strip'&&Kit.param('tab')==='music')){$('.tab[data-panel="p-music"]').click();tab='music'}
drawBeds();render();
const n=NOTE[ST];if(n)say(n[0],{state:n[1]||'',ms:4200});
});
/* proof aid: ?do=<css>;<css> taps those controls in order so a still can show the result; a missing or dead control is a console error. Not part of the room. */
document.addEventListener('DOMContentLoaded',()=>{(Kit.param('do')||'').split(';').filter(Boolean).forEach((q,i)=>setTimeout(()=>{const e=document.querySelector(q);const b=e&&e.getBoundingClientRect();if(!e)console.error('no control '+q);else if(e.disabled)console.error('control is off '+q);else if(e.closest('[hidden]')||!b.width||!b.height)console.error('control is hidden '+q);else e.click()},40+i*45))});
</script>
</body></html>
